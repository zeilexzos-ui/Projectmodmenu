name: Build APK from HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK using WebView Template
        run: |
          # 1. Clone template WebView Android
          git clone https://github.com/Kunal-Varma/WebView-App-Template.git temp_app
          
          # 2. Hapus HTML bawaan template, ganti pakai HTML lu
          rm -rf temp_app/app/src/main/assets/*
          cp -r app/src/main/assets/* temp_app/app/src/main/assets/
          
          # 3. Build APK
          cd temp_app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: temp_app/app/build/outputs/apk/debug/app-debug.apk
